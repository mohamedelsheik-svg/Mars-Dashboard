<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"/>
<meta name="theme-color" content="#0a0f1e"/>
<title>Action Plan — خطة العمل</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#0a0f1e;--card:#111827;--card2:#1a2235;--border:#1e2d45;
  --text:#f1f5f9;--text2:#94a3b8;--text3:#475569;
  --primary:#00d4aa;--secondary:#6c63ff;--danger:#ff5252;
  --warn:#ffb300;--success:#00c853;--info:#29b6f6;--orange:#ff7043;
}
.light{--bg:#f0f4f8;--card:#fff;--card2:#f8fafc;--border:#e2e8f0;--text:#0f172a;--text2:#475569;--text3:#94a3b8;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;font-family:'IBM Plex Sans Arabic',sans-serif;background:var(--bg);color:var(--text);font-size:13px}

/* HEADER */
.hdr{position:sticky;top:0;z-index:100;background:var(--card);border-bottom:1px solid var(--border);padding:10px 14px;display:flex;align-items:center;gap:10px}
.hdr h1{font-size:15px;font-weight:700;color:var(--primary);flex:1}
.hdr p{font-size:11px;color:var(--text2);margin-top:1px}
.hbtn{width:32px;height:32px;border-radius:50%;border:1px solid var(--border);background:transparent;color:var(--text);font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center}

/* LAYOUT */
.layout{display:flex;height:calc(100vh - 53px);overflow:hidden}

/* REP SIDEBAR */
.sidebar{width:200px;flex-shrink:0;overflow-y:auto;border-left:1px solid var(--border);background:var(--card)}
.sidebar::-webkit-scrollbar{width:3px}.sidebar::-webkit-scrollbar-thumb{background:var(--border)}
.rep-item{padding:10px 12px;border-bottom:0.5px solid var(--border);cursor:pointer;transition:background .15s}
.rep-item:hover{background:var(--card2)}
.rep-item.active{background:var(--primary)15;border-right:2px solid var(--primary)}
.rep-name{font-size:12px;font-weight:600;color:var(--text);line-height:1.3;margin-bottom:3px}
.rep-meta{font-size:10px;color:var(--text3)}
.rep-badges{display:flex;gap:4px;margin-top:4px;flex-wrap:wrap}
.rb{font-size:10px;font-weight:700;padding:1px 6px;border-radius:10px}
.rb-crit{background:#ff525222;color:#ff5252}
.rb-ok{background:#00c85322;color:#00c853}
.rb-city{background:var(--card2);color:var(--text2)}

/* MAIN CONTENT */
.main{flex:1;overflow-y:auto;padding:12px}
.main::-webkit-scrollbar{width:4px}.main::-webkit-scrollbar-thumb{background:var(--border)}

/* SEARCH BAR */
.search-bar{display:flex;gap:8px;margin-bottom:12px;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:8px 12px;align-items:center}
.search-bar input{flex:1;background:transparent;border:none;outline:none;color:var(--text);font-size:13px;text-align:right;direction:rtl}
.search-bar input::placeholder{color:var(--text3)}

/* STORE CARDS */
.store-card{background:var(--card);border:1px solid var(--border);border-radius:14px;margin-bottom:10px;overflow:hidden}
.store-card.critical{border-color:#ff525244}
.store-header{display:flex;align-items:center;gap:10px;padding:10px 12px;cursor:pointer;user-select:none}
.store-header:active{background:var(--card2)}
.score-ring{width:44px;height:44px;flex-shrink:0;position:relative}
.score-ring svg{transform:rotate(-90deg)}
.score-pct{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700}
.store-info{flex:1;min-width:0}
.store-name{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.store-meta{font-size:11px;color:var(--text2);margin-top:2px}
.store-badges{display:flex;gap:4px;margin-top:4px;flex-wrap:wrap}
.badge{display:inline-flex;align-items:center;padding:2px 7px;border-radius:10px;font-size:10px;font-weight:700}
.b-scale{background:#00d4aa22;color:#00d4aa}
.b-ph{background:#ff704322;color:#ff7043}
.b-crit{background:#ff525222;color:#ff5252}
.b-cls{background:var(--card2);color:var(--text2)}
.chevron{color:var(--text3);transition:transform .2s;flex-shrink:0}
.chevron.open{transform:rotate(90deg)}

/* GAP DETAILS */
.gap-body{display:none;padding:0 12px 12px}
.gap-body.open{display:block}

.cat-section{background:var(--card2);border-radius:10px;margin-bottom:8px;overflow:hidden}
.cat-header{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--border)}
.cat-icon{font-size:16px;flex-shrink:0}
.cat-name{font-size:12px;font-weight:700;flex:1}
.cat-loc{font-size:10px;color:var(--text2);background:var(--card);padding:2px 7px;border-radius:8px;border:1px solid var(--border)}

.kpi-pills{display:flex;gap:4px;padding:6px 10px;flex-wrap:wrap;border-bottom:0.5px solid var(--border)44}
.kpi-pill{font-size:10px;font-weight:700;padding:2px 8px;border-radius:10px}
.kpi-ctu{background:#00d4aa22;color:#00d4aa}
.kpi-nbl{background:#6c63ff22;color:#6c63ff}
.kpi-pen{background:#ffb30022;color:#ffb300}

.sku-list{padding:6px 10px}
.sku-row{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:0.5px solid var(--border)44}
.sku-row:last-child{border-bottom:none}
.sku-dot{width:6px;height:6px;border-radius:50%;background:#ff5252;flex-shrink:0}
.sku-code{font-family:monospace;font-size:10px;color:var(--text3);flex-shrink:0}
.sku-name{font-size:11px;color:var(--text);flex:1}

/* SUMMARY CARDS */
.summary-row{display:flex;gap:8px;margin-bottom:12px}
.sum-card{flex:1;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:10px 12px;text-align:center}
.sum-val{font-size:22px;font-weight:800}
.sum-lbl{font-size:10px;color:var(--text2);margin-top:2px}

/* EMPTY */
.empty{text-align:center;padding:40px 20px;color:var(--text3)}

/* LOADING */
#loader{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:999}
.spinner{width:40px;height:40px;border:3px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* MOBILE SIDEBAR TOGGLE */
.sidebar-toggle{display:none}
@media(max-width:600px){
  .sidebar{position:fixed;right:-200px;top:53px;height:calc(100vh - 53px);z-index:90;transition:right .25s;box-shadow:-4px 0 20px #0004}
  .sidebar.open{right:0}
  .sidebar-toggle{display:flex}
  .main{width:100%}
}

/* FILTER TABS */
.filter-tabs{display:flex;gap:6px;margin-bottom:10px;overflow-x:auto;padding-bottom:2px}
.filter-tabs::-webkit-scrollbar{display:none}
.ftab{flex-shrink:0;padding:5px 12px;border-radius:20px;font-size:11px;font-weight:700;cursor:pointer;border:1px solid var(--border);background:var(--card2);color:var(--text2);transition:all .15s}
.ftab.active{background:var(--primary)22;color:var(--primary);border-color:var(--primary)66}
.ftab.danger.active{background:#ff525222;color:#ff5252;border-color:#ff525244}
</style>
</head>
<body>

<div id="loader">
  <div class="spinner"></div>
  <p style="margin-top:14px;color:var(--text2);font-size:13px">جاري تحميل بيانات الأصناف الناقصة...</p>
</div>

<!-- HEADER -->
<div class="hdr">
  <button class="hbtn sidebar-toggle" id="sidebar-toggle-btn" title="المندوبين">☰</button>
  <div style="flex:1">
    <h1>🎯 Action Plan — الأصناف الناقصة</h1>
    <p id="hdr-sub">تحميل البيانات...</p>
  </div>
  <button class="hbtn" id="theme-btn" title="Theme">☀️</button>
</div>

<div class="layout">
  <!-- SIDEBAR: Rep List -->
  <div class="sidebar" id="sidebar">
    <div style="padding:8px 12px;border-bottom:1px solid var(--border);font-size:11px;font-weight:700;color:var(--text2)">
      المندوبون (31)
    </div>
    <div id="rep-list"></div>
  </div>

  <!-- MAIN -->
  <div class="main" id="main-panel">
    <!-- Rep Summary -->
    <div id="rep-summary" style="display:none">
      <div class="summary-row" id="sum-cards"></div>
      <!-- Search -->
      <div class="search-bar">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="var(--text3)" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        <input id="store-search" placeholder="بحث باسم أو كود العميل..." type="text"/>
      </div>
      <!-- Filters -->
      <div class="filter-tabs" id="filter-tabs">
        <div class="ftab active" data-filter="all">الكل</div>
        <div class="ftab danger" data-filter="critical">🔴 حرج (0%)</div>
        <div class="ftab" data-filter="low">⚠️ ضعيف (&lt;50%)</div>
        <div class="ftab" data-filter="scale">⚖️ Scale</div>
        <div class="ftab" data-filter="ph">🏪 PH</div>
      </div>
      <!-- Store list -->
      <div id="stores-list"></div>
    </div>

    <!-- Welcome -->
    <div id="welcome" style="text-align:center;padding:48px 16px;color:var(--text3)">
      <div style="font-size:48px;margin-bottom:16px">🎯</div>
      <div style="font-size:16px;font-weight:700;color:var(--text2);margin-bottom:8px">اختر مندوباً من القائمة</div>
      <div style="font-size:13px">لعرض الأصناف الناقصة في عملاءه</div>
    </div>
  </div>
</div>

<script>
let DATA = null;
let currentRep = null;
let currentFilter = 'all';
let searchQ = '';
let isDark = true;

const CAT_ICON = {
  'Chocolate':'🍫','Fruity Confections':'🍬','Gum':'🌿',
  'Ice Cream':'🍦','Petfood':'🐾'
};
const CAT_AR = {
  'Chocolate':'شوكولاتة','Fruity Confections':'حلوى فواكه',
  'Gum':'علكة','Ice Cream':'آيس كريم','Petfood':'طعام حيوانات'
};
const KPI_AR = {'CTU':'كاشير','NBL':'رف','Penetration':'اختراق'};
const LOC_AR = {
  'Checkout':'الكاشير','Main Aisle':'الرف الرئيسي',
  'Freezer':'الفريزر','Chiller':'الثلاجة'
};

function sc(s){return s>=0.8?'#00c853':s>=0.5?'#ffb300':'#ff5252'}

// ─── LOAD DATA ────────────────────────────────────────────────
async function loadData(){
  try{
    const r = await fetch('rep_gaps.json');
    DATA = await r.json();
    document.getElementById('loader').style.display='none';
    renderRepList();
    document.getElementById('hdr-sub').textContent =
      `${Object.keys(DATA).length} مندوب — ${Object.values(DATA).reduce((a,r)=>a+r.total_stores,0)} عميل بفجوات`;
  }catch(e){
    document.getElementById('loader').innerHTML='<p style="color:#ff5252;padding:20px">فشل تحميل rep_gaps.json</p>';
  }
}

// ─── REP LIST ─────────────────────────────────────────────────
function renderRepList(){
  const list = document.getElementById('rep-list');
  list.innerHTML = Object.entries(DATA).map(([rep, rd]) => `
    <div class="rep-item" data-rep="${rep}" onclick="selectRep('${rep.replace(/'/g,"\\'")}')">
      <div class="rep-name">${rd.rep_name||'غير محدد'}</div>
      <div class="rep-meta">${rd.city||'—'}</div>
      <div class="rep-badges">
        <span class="rb rb-crit">🔴 ${rd.critical_count}</span>
        <span class="rb rb-ok">✅ ${rd.total_stores - rd.critical_count}</span>
      </div>
    </div>
  `).join('');
}

// ─── SELECT REP ───────────────────────────────────────────────
function selectRep(rep){
  currentRep = rep;
  currentFilter = 'all';
  searchQ = '';
  document.getElementById('store-search').value = '';
  document.querySelectorAll('.rep-item').forEach(el=>{
    el.classList.toggle('active', el.dataset.rep === rep);
  });
  document.getElementById('welcome').style.display='none';
  document.getElementById('rep-summary').style.display='block';
  // Close sidebar on mobile
  document.getElementById('sidebar').classList.remove('open');
  renderRepSummary();
}

function renderRepSummary(){
  const rd = DATA[currentRep];
  if(!rd) return;

  // Summary cards
  const totalMissing = rd.stores.reduce((a,s)=>a+s.total_missing_skus,0);
  document.getElementById('sum-cards').innerHTML = `
    <div class="sum-card">
      <div class="sum-val" style="color:#ff5252">${rd.critical_count}</div>
      <div class="sum-lbl">عميل حرج 🔴</div>
    </div>
    <div class="sum-card">
      <div class="sum-val" style="color:var(--warn)">${rd.total_stores}</div>
      <div class="sum-lbl">إجمالي العملاء</div>
    </div>
    <div class="sum-card">
      <div class="sum-val" style="color:var(--orange)">${totalMissing}</div>
      <div class="sum-lbl">صنف ناقص</div>
    </div>
    <div class="sum-card">
      <div class="sum-val" style="color:var(--primary)">${(rd.stores.reduce((a,s)=>a+s.overall,0)/rd.stores.length*100).toFixed(0)}%</div>
      <div class="sum-lbl">متوسط الأداء</div>
    </div>
  `;
  renderStores();
}

// ─── RENDER STORES ────────────────────────────────────────────
function renderStores(){
  const rd = DATA[currentRep];
  if(!rd) return;

  let stores = rd.stores;

  // Filter
  if(currentFilter === 'critical') stores = stores.filter(s=>s.critical);
  else if(currentFilter === 'low')  stores = stores.filter(s=>s.overall < 0.5);
  else if(currentFilter === 'scale') stores = stores.filter(s=>s.type==='Scale');
  else if(currentFilter === 'ph')   stores = stores.filter(s=>s.type==='PH');

  // Search
  if(searchQ){
    const q = searchQ.toLowerCase();
    stores = stores.filter(s =>
      s.name.toLowerCase().includes(q) || s.code.toLowerCase().includes(q)
    );
  }

  if(!stores.length){
    document.getElementById('stores-list').innerHTML =
      `<div class="empty">لا توجد نتائج</div>`;
    return;
  }

  document.getElementById('stores-list').innerHTML = stores.map((s,i) => {
    const color = sc(s.overall);
    const radius = 18, circ = 2*Math.PI*radius;
    const dash = s.overall * circ;
    return `
    <div class="store-card ${s.critical?'critical':''}" id="sc-${i}">
      <div class="store-header" onclick="toggleStore(${i})">
        <!-- Score ring -->
        <div class="score-ring">
          <svg width="44" height="44" viewBox="0 0 44 44">
            <circle cx="22" cy="22" r="${radius}" fill="none" stroke="var(--border)" stroke-width="4"/>
            <circle cx="22" cy="22" r="${radius}" fill="none" stroke="${color}" stroke-width="4"
              stroke-dasharray="${dash} ${circ}" stroke-linecap="round"/>
          </svg>
          <div class="score-pct" style="color:${color}">${(s.overall*100).toFixed(0)}%</div>
        </div>
        <!-- Info -->
        <div class="store-info">
          <div class="store-name">${s.name||s.code}</div>
          <div class="store-meta">${s.code} · ${s.city}</div>
          <div class="store-badges">
            <span class="badge ${s.type==='Scale'?'b-scale':'b-ph'}">${s.type==='Scale'?'⚖️ Scale':'🏪 PH'}</span>
            ${s.critical?'<span class="badge b-crit">🔴 حرج</span>':''}
            ${s.class_name?`<span class="badge b-cls">${s.class_name}</span>`:''}
            <span style="font-size:10px;color:var(--orange);font-weight:700">${s.total_missing_skus} صنف ناقص</span>
          </div>
        </div>
        <svg class="chevron" id="chev-${i}" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg>
      </div>
      <!-- GAP DETAILS -->
      <div class="gap-body" id="gb-${i}">
        ${s.cat_gaps.map(cg => renderCatGap(cg)).join('')}
      </div>
    </div>`;
  }).join('');
}

function renderCatGap(cg){
  const icon = CAT_ICON[cg.cat]||'📦';
  const catAr = CAT_AR[cg.cat]||cg.cat;
  const locAr = LOC_AR[cg.loc]||cg.loc;
  const kpiHtml = cg.kpis.map(k=>{
    const cls = k.kpi==='CTU'?'kpi-ctu':k.kpi==='NBL'?'kpi-nbl':'kpi-pen';
    return `<span class="kpi-pill ${cls}">${KPI_AR[k.kpi]||k.kpi}: ${k.pct}</span>`;
  }).join('');
  const skuHtml = cg.skus.map(s=>`
    <div class="sku-row">
      <div class="sku-dot"></div>
      <div class="sku-code">${s.code}</div>
      <div class="sku-name">${s.name}</div>
    </div>
  `).join('');
  return `
  <div class="cat-section">
    <div class="cat-header">
      <span class="cat-icon">${icon}</span>
      <span class="cat-name">${catAr}</span>
      <span class="cat-loc">${locAr}</span>
      ${cg.is_critical?'<span style="font-size:10px;color:#ff5252;font-weight:700">🔴 كل الأصناف ناقصة</span>':''}
    </div>
    <div class="kpi-pills">${kpiHtml}</div>
    <div class="sku-list">
      <div style="font-size:10px;color:var(--text3);margin-bottom:4px">الأصناف الناقصة (${cg.skus.length})</div>
      ${skuHtml||'<div style="color:var(--text3);font-size:11px">لا توجد تفاصيل</div>'}
    </div>
  </div>`;
}

function toggleStore(i){
  const body = document.getElementById(`gb-${i}`);
  const chev = document.getElementById(`chev-${i}`);
  body.classList.toggle('open');
  chev.classList.toggle('open');
}

// ─── FILTERS ─────────────────────────────────────────────────
document.getElementById('filter-tabs').addEventListener('click', e=>{
  const tab = e.target.closest('.ftab');
  if(!tab) return;
  document.querySelectorAll('.ftab').forEach(t=>t.classList.remove('active'));
  tab.classList.add('active');
  currentFilter = tab.dataset.filter;
  renderStores();
});

document.getElementById('store-search').addEventListener('input', e=>{
  searchQ = e.target.value.trim();
  renderStores();
});

// ─── THEME ───────────────────────────────────────────────────
document.getElementById('theme-btn').onclick = ()=>{
  isDark = !isDark;
  document.documentElement.classList.toggle('light', !isDark);
  document.getElementById('theme-btn').textContent = isDark ? '☀️' : '🌙';
};

// ─── SIDEBAR TOGGLE (mobile) ──────────────────────────────────
document.getElementById('sidebar-toggle-btn').onclick = ()=>{
  document.getElementById('sidebar').classList.toggle('open');
};

loadData();
</script>
</body>
</html>
